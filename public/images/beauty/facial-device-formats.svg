<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Facial device formats</title><desc id="desc">Original schematic showing a two-sphere microcurrent tool and a slim light wand, not scale drawings or treatment results.</desc><rect width="1200" height="800" rx="36" fill="#f4f0f8"/><circle cx="310" cy="350" r="210" fill="#e1d6ee"/><circle cx="890" cy="350" r="210" fill="#f0d9d8"/><rect x="235" y="300" width="150" height="250" rx="70" fill="#664e81"/><circle cx="260" cy="290" r="63" fill="#bbc5d1"/><circle cx="360" cy="290" r="63" fill="#bbc5d1"/><circle cx="310" cy="425" r="18" fill="#eee7f5"/><rect x="865" y="280" width="50" height="280" rx="25" fill="#977877"/><rect x="795" y="235" width="190" height="70" rx="28" fill="#b89895"/><path d="M822 267h135" stroke="#d75668" stroke-width="14" stroke-linecap="round"/><text x="310" y="635" font-family="system-ui,sans-serif" text-anchor="middle" font-size="30" font-weight="700" fill="#453657">Two-sphere format</text><text x="890" y="635" font-family="system-ui,sans-serif" text-anchor="middle" font-size="30" font-weight="700" fill="#453657">Wand format</text><text x="600" y="705" font-family="system-ui,sans-serif" text-anchor="middle" font-size="24" fill="#695975">Different routines. Read the exact device manual first.</text></svg>
