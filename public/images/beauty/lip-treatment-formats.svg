<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Two lip treatment formats</title><desc id="desc">A stylized jar beside a moon and a squeeze tube beside a small bag. Original diagram, not product photography.</desc><rect width="1200" height="600" rx="32" fill="#fff1f5"/><circle cx="300" cy="270" r="195" fill="#f2d4e2"/><circle cx="900" cy="270" r="195" fill="#e8ddd4"/><path d="M370 90a38 38 0 1 0 46 46 34 34 0 0 1-46-46" fill="#9d174d"/><rect x="190" y="240" width="220" height="150" rx="35" fill="#bd477c"/><rect x="180" y="210" width="240" height="55" rx="20" fill="#7b244e"/><ellipse cx="300" cy="316" rx="68" ry="30" fill="#ffe8ef"/><path d="M833 145h134l-12 225H845z" fill="#a58e7d"/><path d="M845 370h110v53H845z" fill="#5f493e"/><rect x="851" y="210" width="98" height="52" rx="8" fill="#f7eee5"/><text x="300" y="492" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#50213a">A jar for your shelf</text><text x="900" y="492" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#50213a">A tube for your bag</text><text x="600" y="553" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#685569">Choose the routine, then check the exact formula.</text></svg>
