<svg xmlns="http://www.w3.org/2000/svg" width="360" height="765" viewBox="0 0 360 765" role="img" aria-labelledby="title desc"><title id="title">Espresso scale and cup clearance diagram</title><desc id="desc">Measure from tray support to the lowest locked portafilter point. Subtract installed scale and pad height and cup height. Leave room to insert and remove the cup. Published body dimensions alone do not guarantee fit.</desc><rect width="360" height="765" rx="18" fill="#f0fdfa"/><g font-family="system-ui,sans-serif" fill="#134e4a"><text x="22" y="35" font-size="19" font-weight="700">Measure the space left for a cup</text><text x="22" y="62" font-size="15">Illustration only · not to scale</text><path d="M65 100H270V140H180V160H160V140H65Z" fill="#334155"/><text x="45" y="91" font-size="15">Lowest locked portafilter point</text><path d="M112 235H230L216 350H126Z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="142" y="292" font-size="20" font-weight="700">Cup</text><rect x="90" y="356" width="160" height="25" rx="5" fill="#0f766e"/><text x="110" y="412" font-size="17">Scale + any pad</text><path d="M45 390H300" stroke="#334155" stroke-width="5"/><path d="M288 160V382M280 160H296M280 382H296" stroke="#b45309" stroke-width="3"/><text x="38" y="211" font-size="16">Leave insertion / removal room</text><text x="22" y="452" font-size="20" font-weight="700">Your measured gap</text><text x="22" y="482" font-size="17">− installed scale and pad height</text><text x="22" y="512" font-size="17">− your cup height</text><text x="22" y="542" font-size="20" font-weight="700">= remaining headroom</text><rect x="20" y="564" width="320" height="122" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="590" font-size="17" font-weight="700">Published body dimensions</text><text x="35" y="617" font-size="15">Lunar 2021: 105 × 105 × 15.5 mm</text><text x="35" y="642" font-size="15">Exagram Pro: 90 × 95 × 22 mm</text><text x="35" y="666" font-size="14">Include pads; confirm exact versions.</text><text x="22" y="714" font-size="15">Lunar support spec used conservatively;</text><text x="22" y="739" font-size="15">its product page also lists 15 mm.</text></g></svg>
