<svg xmlns="http://www.w3.org/2000/svg" width="360" height="715" viewBox="0 0 360 715" role="img" aria-labelledby="title desc"><title id="title">Ninja CREAMi model to container identification</title><desc id="desc">Original examples use XSKPLID2CD, 16 ounces. Deluxe and listed XL variants use XSKPNTLD2, 24 ounces. NC700 Scoop and Swirl uses XSK7PNTLD2, 16 ounces, with nozzles. Same capacity is not interchangeability.</desc><rect width="360" height="715" rx="18" fill="#f0fdfa"/><g font-family="system-ui,sans-serif" fill="#134e4a"><text x="22" y="35" font-size="20" font-weight="700">Match the model, then the part</text><text x="22" y="62" font-size="15">US examples; check the full suffix</text><rect x="20" y="82" width="320" height="155" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="109" font-size="18" font-weight="700">ORIGINAL</text><text x="35" y="137" font-size="17">NC299AMZ / NC300 / NC301</text><text x="35" y="162" font-size="17">Listed NC350 variants</text><text x="35" y="190" font-size="18" font-weight="700">XSKPLID2CD · 16 oz</text><text x="35" y="216" font-size="15">Storage lids; no Swirl nozzles</text><rect x="20" y="257" width="320" height="155" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="284" font-size="18" font-weight="700">DELUXE / XL</text><text x="35" y="312" font-size="17">NC500 / NC501</text><text x="35" y="337" font-size="17">Listed NC601 variants</text><text x="35" y="365" font-size="18" font-weight="700">XSKPNTLD2 · 24 oz</text><text x="35" y="391" font-size="15">Tubs and storage lids</text><rect x="20" y="432" width="320" height="155" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="459" font-size="18" font-weight="700">SCOOP &amp; SWIRL</text><text x="35" y="487" font-size="17">NC700 / NC701 / NC701Q</text><text x="35" y="512" font-size="17">CN701CO</text><text x="35" y="540" font-size="18" font-weight="700">XSK7PNTLD2 · 16 oz</text><text x="35" y="566" font-size="15">2-in-1 pints, lids and nozzles</text><text x="22" y="639" font-size="16" font-weight="700">Same capacity does not mean same fit.</text><text x="22" y="665" font-size="15">Unlisted model? Use Ninja’s parts finder.</text><text x="22" y="690" font-size="14">Identification guide, not physical fit testing.</text></g></svg>
