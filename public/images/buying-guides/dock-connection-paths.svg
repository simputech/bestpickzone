<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" aria-labelledby="title desc"><title id="title">Native and DisplayLink dock connection paths</title><desc id="desc">TS4 uses a compatible native display host, with DisplayPort and a spare Thunderbolt output. UD-6950PDH requires DisplayLink and uses one output per display channel. Confirm laptop limits, cables and driver policy.</desc><rect width="360" height="700" rx="18" fill="#f0fdfa"/><g font-family="system-ui,sans-serif" fill="#134e4a"><text x="22" y="35" font-size="20" font-weight="700">Two screens: follow the signal</text><text x="22" y="62" font-size="14">Example routes, not a tested setup</text><rect x="20" y="80" width="320" height="235" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="108" font-size="18" font-weight="700">NATIVE: CalDigit TS4</text><text x="35" y="136" font-size="17">Compatible Thunderbolt / USB4 host</text><text x="170" y="166" font-size="25">↓</text><text x="35" y="197" font-size="17">TS4 host port</text><text x="35" y="229" font-size="17">DisplayPort → screen 1</text><text x="35" y="257" font-size="17">Spare Thunderbolt → screen 2</text><text x="35" y="287" font-size="15">Use the correct video adapter.</text><rect x="20" y="335" width="320" height="235" rx="12" fill="white" stroke="#0f766e"/><text x="35" y="363" font-size="18" font-weight="700">SOFTWARE: UD-6950PDH</text><text x="35" y="391" font-size="17">Supported host + DisplayLink</text><text x="170" y="421" font-size="25">↓</text><text x="35" y="452" font-size="17">Dock: two display channels</text><text x="35" y="484" font-size="17">One HDMI or DP per channel</text><text x="35" y="514" font-size="17">Two extended office displays</text><text x="35" y="544" font-size="15">Driver approval is required.</text><text x="22" y="602" font-size="16">Check exact laptop and both monitors.</text><text x="22" y="627" font-size="16">USB-C shape alone proves no video fit.</text><text x="22" y="652" font-size="16">On macOS, this DisplayLink dock can</text><text x="22" y="677" font-size="16">block protected video on all displays.</text></g></svg>
