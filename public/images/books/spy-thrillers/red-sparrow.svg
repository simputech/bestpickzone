<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Red Sparrow custom cover art</title>
  <desc id="desc">A modern intelligence themed custom recommendation image with sharp red accents for Red Sparrow by Jason Matthews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3f0d12"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#bg)"/>
  <polygon points="470,90 530,170 430,170" fill="#fca5a5" opacity="0.7"/>
  <rect x="70" y="90" width="500" height="780" rx="28" fill="none" stroke="#fecaca" stroke-width="3" opacity="0.48"/>
  <line x1="116" y1="258" x2="524" y2="258" stroke="#fca5a5" stroke-width="2" opacity="0.4"/>
  <line x1="116" y1="286" x2="524" y2="286" stroke="#fca5a5" stroke-width="2" opacity="0.4"/>
  <text x="116" y="132" fill="#fee2e2" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="7">MODERN PICK</text>
  <text x="116" y="472" fill="#fff1f2" font-family="Georgia, serif" font-size="94" font-weight="700">Red</text>
  <text x="116" y="566" fill="#fff1f2" font-family="Georgia, serif" font-size="94" font-weight="700">Sparrow</text>
  <text x="116" y="638" fill="#fecaca" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="3">Jason Matthews</text>
  <text x="116" y="716" fill="#fda4af" font-family="Arial, Helvetica, sans-serif" font-size="26">Recruitment psychology. Surveillance discipline.</text>
  <text x="116" y="752" fill="#fda4af" font-family="Arial, Helvetica, sans-serif" font-size="26">Recent state-actor espionage with procedural weight.</text>
</svg>
