<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">The Company custom cover art</title>
  <desc id="desc">A sprawling archival styled book image with dossier blocks and typography for The Company by Robert Littell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#bg)"/>
  <rect x="66" y="86" width="508" height="788" rx="28" fill="none" stroke="#fed7aa" stroke-width="3" opacity="0.5"/>
  <rect x="112" y="170" width="416" height="100" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.35"/>
  <rect x="112" y="292" width="416" height="100" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.35"/>
  <rect x="112" y="414" width="416" height="100" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.35"/>
  <text x="118" y="128" fill="#ffedd5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="7">CIA EPIC</text>
  <text x="118" y="610" fill="#fff7ed" font-family="Georgia, serif" font-size="88" font-weight="700">The</text>
  <text x="118" y="700" fill="#fff7ed" font-family="Georgia, serif" font-size="96" font-weight="700">Company</text>
  <text x="118" y="772" fill="#fed7aa" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="3">Robert Littell</text>
  <text x="118" y="826" fill="#fdba74" font-family="Arial, Helvetica, sans-serif" font-size="24">A huge, bureaucratic, multidecade intelligence saga.</text>
</svg>
