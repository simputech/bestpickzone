<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Death on the Nile custom cover art</title>
  <desc id="desc">Custom recommendation artwork for Death on the Nile by Agatha Christie, showing a paddle steamer on the river at sunset with palm silhouettes and a warm desert sky.</desc>
  <defs>
    <linearGradient id="bgNile" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a3b1e"/>
      <stop offset="55%" stop-color="#c9722f"/>
      <stop offset="100%" stop-color="#2c3b54"/>
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#bgNile)"/>
  <rect x="74" y="92" width="492" height="776" rx="28" fill="none" stroke="#fbe6c8" stroke-width="3" opacity="0.5"/>
  <circle cx="460" cy="300" r="70" fill="#fbe6c8" opacity="0.85"/>
  <g fill="#23170e" opacity="0.9">
    <path d="M150 540 q10 -120 -10 -160 q-10 90 0 160 Z"/>
    <path d="M150 540 q40 -90 80 -110 q-40 70 -60 110 Z"/>
    <path d="M150 540 q-50 -80 -90 -90 q40 60 70 90 Z"/>
    <path d="M150 540 q20 -110 60 -150 q-20 90 -40 150 Z"/>
  </g>
  <rect x="170" y="600" width="280" height="80" rx="6" fill="#1c2738"/>
  <rect x="200" y="560" width="220" height="50" rx="6" fill="#fbe6c8"/>
  <rect x="290" y="500" width="10" height="70" fill="#1c2738"/>
  <ellipse cx="310" cy="700" rx="220" ry="20" fill="#1c2738" opacity="0.6"/>
  <text x="118" y="140" fill="#fbe6c8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6">GLAMOROUS PICK</text>
  <text x="118" y="250" fill="#fff8ec" font-family="Georgia, serif" font-size="58" font-weight="700">Death on</text>
  <text x="118" y="316" fill="#fff8ec" font-family="Georgia, serif" font-size="58" font-weight="700">the Nile</text>
  <text x="118" y="370" fill="#f3d8b1" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="3">Agatha Christie</text>
  <text x="118" y="850" fill="#fdf2de" font-family="Arial, Helvetica, sans-serif" font-size="24">Egypt, jealousy, and money turn a fair-play</text>
  <text x="118" y="884" fill="#fdf2de" font-family="Arial, Helvetica, sans-serif" font-size="24">mystery into a sun-drenched melodrama.</text>
</svg>
