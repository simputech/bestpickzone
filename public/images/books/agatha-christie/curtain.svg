<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Curtain custom cover art</title>
  <desc id="desc">Custom recommendation artwork for Curtain by Agatha Christie, showing heavy theater-style curtains closing over a faint silhouette of the Styles country house.</desc>
  <defs>
    <linearGradient id="bgCurtain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a0f12"/>
      <stop offset="100%" stop-color="#5c1f29"/>
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#bgCurtain)"/>
  <rect x="74" y="92" width="492" height="776" rx="28" fill="none" stroke="#f0d9da" stroke-width="3" opacity="0.5"/>
  <path d="M180 480 l0 200 l260 0 l-30 -90 l20 -40 l-40 -30 l30 -40 z" fill="#0d0608" opacity="0.5"/>
  <path d="M120 92 v500 q40 30 80 0 v-500 Z" fill="#7a1f2b"/>
  <path d="M210 92 v520 q40 30 80 0 v-520 Z" fill="#8c2530"/>
  <path d="M430 92 v520 q40 30 80 0 v-520 Z" fill="#8c2530"/>
  <path d="M520 92 v500 q40 30 80 0 v-500 Z" fill="#7a1f2b"/>
  <rect x="74" y="92" width="492" height="40" fill="#5c1620"/>
  <text x="118" y="140" fill="#f0d9da" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6">SAVE FOR LAST</text>
  <text x="200" y="430" fill="#fbeef0" font-family="Georgia, serif" font-size="80" font-weight="700" text-anchor="middle">Curtain</text>
  <text x="200" y="478" fill="#e6bfc4" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="3" text-anchor="middle">Agatha Christie</text>
  <text x="118" y="850" fill="#f3e1e3" font-family="Arial, Helvetica, sans-serif" font-size="24">Poirot and Hastings return to Styles for a final,</text>
  <text x="118" y="884" fill="#f3e1e3" font-family="Arial, Helvetica, sans-serif" font-size="24">morally severe case that closes the arc for good.</text>
</svg>
