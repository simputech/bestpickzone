<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">The Murder of Roger Ackroyd custom cover art</title>
  <desc id="desc">Custom recommendation artwork for The Murder of Roger Ackroyd by Agatha Christie, showing a study desk with a letter opener, a torn envelope, and a dictaphone in shadow.</desc>
  <defs>
    <linearGradient id="bgAckroyd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#241a14"/>
      <stop offset="100%" stop-color="#6e4b2c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#bgAckroyd)"/>
  <rect x="74" y="92" width="492" height="776" rx="28" fill="none" stroke="#f3e3c5" stroke-width="3" opacity="0.5"/>
  <rect x="170" y="600" width="300" height="160" rx="8" fill="#1a120c" opacity="0.5"/>
  <rect x="190" y="630" width="160" height="100" rx="4" fill="#e9dcc0"/>
  <rect x="200" y="650" width="140" height="4" fill="#241a14"/>
  <rect x="200" y="664" width="120" height="4" fill="#241a14"/>
  <rect x="200" y="678" width="130" height="4" fill="#241a14"/>
  <path d="M380 700 l60 -60 l8 8 l-60 60 Z" fill="#cfae6f"/>
  <path d="M438 642 l10 -10 l8 8 l-10 10 Z" fill="#e9dcc0"/>
  <ellipse cx="420" cy="660" rx="6" ry="14" fill="#cfae6f" transform="rotate(45 420 660)"/>
  <text x="118" y="140" fill="#f3e3c5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="8">READ EARLY</text>
  <text x="118" y="250" fill="#fbf3e1" font-family="Georgia, serif" font-size="52" font-weight="700">The Murder of</text>
  <text x="118" y="316" fill="#fbf3e1" font-family="Georgia, serif" font-size="52" font-weight="700">Roger Ackroyd</text>
  <text x="118" y="370" fill="#e1cda3" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="3">Agatha Christie</text>
  <text x="118" y="850" fill="#efe1c4" font-family="Arial, Helvetica, sans-serif" font-size="24">The village mystery that quietly rewrote</text>
  <text x="118" y="884" fill="#efe1c4" font-family="Arial, Helvetica, sans-serif" font-size="24">the rules of fair-play detective fiction.</text>
</svg>
