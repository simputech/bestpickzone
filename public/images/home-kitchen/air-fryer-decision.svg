<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Three checks before buying an air fryer</title><desc id="desc">Verify the model label, check the basket against your meals, and measure usable counter space.</desc><rect width="960" height="320" rx="24" fill="#172538"/><g font-family="system-ui,sans-serif"><text x="40" y="60" fill="#fff" font-size="26" font-weight="700">Choose by the job, then verify the model</text><g fill="#f5eadb"><rect x="40" y="100" width="275" height="170" rx="16"/><rect x="342" y="100" width="275" height="170" rx="16"/><rect x="644" y="100" width="275" height="170" rx="16"/></g><g fill="#172538" font-size="22" font-weight="700"><text x="60" y="145">1 · Model label</text><text x="362" y="145">2 · Your meals</text><text x="664" y="145">3 · Counter space</text></g><g fill="#34445a" font-size="18"><text x="60" y="190">CP358-AF or AF101</text><text x="60" y="225">Check the exact code</text><text x="362" y="190">Portions and layout</text><text x="362" y="225">Plan for batch cooking</text><text x="664" y="190">Basket + ventilation</text><text x="664" y="225">Follow the unit's manual</text></g></g></svg>