name: Editorial pilot
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: editorial-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    name: BestPickZone pilot quality (not publishing approval)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validator and existing unit tests
        run: node --test scripts/editorial/*.test.mjs scripts/*.test.mjs scripts/test-*.cjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build, metadata, and sitemap indexability
        run: npm run build
      - name: Generate diagnostic scope and quality pack
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/editorial/prepare.mjs "$BASE_SHA" "$HEAD_SHA" "$BASE_SHA" "$RUNNER_TEMP/editorial-pack"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editorial-pilot-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/editorial-pack/
          if-no-files-found: warn
          retention-days: 7
      - name: Pilot status
        run: |
          echo "Semantic reviewer and publishing gate are INACTIVE." >> "$GITHUB_STEP_SUMMARY"
          echo "This quality check is not publishing approval. No model API or deployment credentials are used." >> "$GITHUB_STEP_SUMMARY"
